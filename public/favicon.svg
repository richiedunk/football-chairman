<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Undisclosed Football">
  <!-- Drawn rather than downscaled: at 16px the photographed badge is mush.
       Only two things survive that size, so only two things are here — the
       shield's silhouette, and a man in a suit with nothing where his face
       should be.

       The head is solid on purpose. A dark void inside a white head reads as
       a face at this size, which turns the mark into the standard account
       glyph; blank reads as blank. The collar and tie are what stop it being
       any old silhouette. -->
  <rect width="64" height="64" rx="14" fill="#08090B"/>
  <path d="M32 9 52 17v18c0 9.5-8.2 16.6-20 21-11.8-4.4-20-11.5-20-21V17z"
        fill="none" stroke="#C8FF4D" stroke-width="3.2" stroke-linejoin="round"/>
  <!-- Head: featureless. -->
  <ellipse cx="32" cy="25.5" rx="7.4" ry="8.2" fill="#FFFFFF"/>
  <!-- Shoulders, with the collar cut out of them and a tie hung in the gap. -->
  <path d="M21 48c0-6.3 4.6-10.1 11-10.1S43 41.7 43 48z" fill="#FFFFFF"/>
  <path d="M32 37.9 27.6 39.4 32 44.6 36.4 39.4z" fill="#08090B"/>
  <path d="M32 44.6 30.2 48h3.6z" fill="#08090B"/>
</svg>
