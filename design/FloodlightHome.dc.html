<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; }
    a { color: #C8FF4D; } a:hover { color: #B2E82F; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0C0D10; color: #F2F3F5; display: flex; flex-direction: column; overflow: hidden">

  <!-- Top: club identity, nothing else -->
  <div style="padding: 22px 20px 0; display: flex; flex-direction: column; gap: 3px">
    <div style="display: flex; align-items: center; gap: 9px">
      <div style="width: 4px; height: 20px; background: #DA291C; border-radius: 2px"></div>
      <div style="font-size: 19px; font-weight: 700; letter-spacing: -0.02em">Manchester United</div>
    </div>
    <div style="font-size: 13px; color: #74777E; padding-left: 13px">The Prem · Week 22</div>
  </div>

  <!-- The one number that matters -->
  <div style="padding: 26px 20px 22px; display: flex; align-items: flex-end; gap: 16px">
    <div style="display: flex; align-items: baseline; gap: 2px">
      <div style="font-size: 76px; font-weight: 700; line-height: 0.82; letter-spacing: -0.055em">4</div>
      <div style="font-size: 26px; font-weight: 500; color: #74777E; letter-spacing: -0.02em">th</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 5px; padding-bottom: 6px">
      <div style="font-size: 13px; color: #74777E">44 pts · board want 6th</div>
      <div style="display: flex; gap: 4px">
        <div style="width: 19px; height: 5px; border-radius: 3px; background: #C8FF4D"></div>
        <div style="width: 19px; height: 5px; border-radius: 3px; background: #C8FF4D"></div>
        <div style="width: 19px; height: 5px; border-radius: 3px; background: #3A3D45"></div>
        <div style="width: 19px; height: 5px; border-radius: 3px; background: #C8FF4D"></div>
        <div style="width: 19px; height: 5px; border-radius: 3px; background: #E5484D"></div>
      </div>
    </div>
  </div>

  <div style="height: 1px; background: #1E2027; margin: 0 20px"></div>

  <!-- Next fixture -->
  <div style="padding: 20px; display: flex; flex-direction: column; gap: 12px">
    <div style="font-size: 11px; font-weight: 500; letter-spacing: 0.13em; color: #74777E">SATURDAY</div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: center; gap: 11px">
        <div style="width: 3px; height: 32px; background: #034694; border-radius: 2px"></div>
        <div style="display: flex; flex-direction: column; gap: 1px">
          <div style="font-size: 18px; font-weight: 500; letter-spacing: -0.015em">Chelsea</div>
          <div style="font-size: 12px; color: #74777E">Away · 3rd</div>
        </div>
      </div>
      <div style="font-size: 12px; color: #74777E; text-align: right; line-height: 1.5">2 out<br>1 doubt</div>
    </div>
  </div>

  <!-- Things wanting a decision -->
  <div style="padding: 4px 20px 0; display: flex; flex-direction: column; gap: 0">
    <div style="display: flex; align-items: center; gap: 12px; padding: 15px 0; border-top: 1px solid #1E2027">
      <div style="width: 7px; height: 7px; border-radius: 50%; background: #E5484D; flex-shrink: 0"></div>
      <div style="flex-grow: 1; font-size: 15px">Bruno's deal expires in June</div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4A4D55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 15px 0; border-top: 1px solid #1E2027">
      <div style="width: 7px; height: 7px; border-radius: 50%; background: #F5A524; flex-shrink: 0"></div>
      <div style="flex-grow: 1; font-size: 15px">Newcastle bid £34m for Mainoo</div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4A4D55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 15px 0; border-top: 1px solid #1E2027; border-bottom: 1px solid #1E2027">
      <div style="width: 7px; height: 7px; border-radius: 50%; background: #3A3D45; flex-shrink: 0"></div>
      <div style="flex-grow: 1; font-size: 15px; color: #A5A8B0">Scout report on Zirkzee filed</div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4A4D55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </div>
  </div>

  <div style="flex-grow: 1"></div>

  <!-- The action -->
  <div style="padding: 0 20px 14px">
    <div style="height: 54px; border-radius: 27px; background: #C8FF4D; color: #10130A; display: flex; align-items: center; justify-content: center; gap: 9px; font-size: 16px; font-weight: 700; letter-spacing: -0.01em">
      Advance to Week 23
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#10130A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </div>
  </div>

  <!-- Nav -->
  <div style="height: 62px; border-top: 1px solid #1E2027; display: flex; align-items: center; justify-content: space-around; padding: 0 8px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#F2F3F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v10a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
      <div style="font-size: 10px; color: #F2F3F5">Club</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#5A5D65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/></svg>
      <div style="font-size: 10px; color: #5A5D65">Squad</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#5A5D65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M21 3l-7 7M8 21H3v-5M3 21l7-7"/></svg>
      <div style="font-size: 10px; color: #5A5D65">Market</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; position: relative">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#5A5D65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M4 8l8 5 8-5"/></svg>
      <div style="position: absolute; top: -3px; right: 4px; width: 15px; height: 15px; border-radius: 8px; background: #E5484D; color: #fff; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center">3</div>
      <div style="font-size: 10px; color: #5A5D65">Inbox</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#5A5D65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 9l-5 5-3-3-4 4"/></svg>
      <div style="font-size: 10px; color: #5A5D65">League</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
