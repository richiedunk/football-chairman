<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 576" width="640" height="576" role="img" aria-label="Undisclosed Football">
  <!--
    The badge, and the source every icon is cut from. `npm run icons`
    regenerates them; nothing in public/ is edited by hand.

    The shield is drawn rather than photographed because the original closed
    around the wordmark rather than around the figure, and the only way to
    close it on the raster was to scale the designer's bottom point up by 1.6
    to meet the sides it had to join — which scaled its stroke with it and left
    a visible step at the seam. Drawn, the stroke is one weight the whole way
    round: 25 against a 616-wide shield, which is the 0.04 ratio measured off
    the original.

    The figure is the original artwork, lifted out and left alone. It is the
    half of this mark that is worth anything.

    The bar is the redaction. It went on in the identity pass (docs/identity.md):
    the mark was a man in a suit, which is you and could be any management
    game; with his face withheld it is the player you are buying, who is the
    one you cannot see. Level, slightly wider than the head, and drawn by
    somebody who did not care how it looked — with a keyline heavy enough to
    survive 48px, where three units of lime vanished and left it reading as a
    hole in the drawing.

    The ball is redrawn. Fitting an arc through the original's puts its centre
    at y=697 with a radius of 176, and it was cut at 648 — only the top third
    of it was ever drawn, so there was nothing to lift. It has to be here at
    all because the figure is a bust that ends in a flat cut, and the ball is
    what the original put in front of that cut. Its pattern sits high because
    the bottom of the ball is never seen.
  -->
  <defs>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8E02C"/>
      <stop offset="0.5" stop-color="#C8FF4D"/>
      <stop offset="1" stop-color="#9BD124"/>
    </linearGradient>
    <clipPath id="inside">
      <path d="M320 12 L622 118 L612 300 C592 396 468 480 320 556 C172 480 48 396 28 300 L18 118 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#inside)">
    <image href="data:image/png;base64," x="60" y="58" width="520" height="306"/>
    <circle cx="320" cy="496" r="137" fill="#08090B"/>
    <circle cx="320" cy="496" r="120" fill="#FFFFFF"/>
    <g stroke="#08090B" stroke-width="16.8" stroke-linecap="round">
      <line x1="320.0" y1="407.2" x2="320.0" y2="363.2"/>
      <line x1="365.7" y1="440.4" x2="445.3" y2="382.6"/>
      <line x1="348.2" y1="494.2" x2="441.9" y2="524.6"/>
      <line x1="291.8" y1="494.2" x2="198.1" y2="524.6"/>
      <line x1="274.3" y1="440.4" x2="194.7" y2="382.6"/>
    </g>
    <path d="M320.0,407.2L365.7,440.4L348.2,494.2L291.8,494.2L274.3,440.4Z" fill="#08090B"/>
    <rect x="228" y="164" width="184" height="36" fill="#08090B"/>
    <rect x="228" y="164" width="184" height="36" fill="none" stroke="#C8FF4D" stroke-width="9"/>
  </g>

  <path d="M320 12 L622 118 L612 300 C592 396 468 480 320 556 C172 480 48 396 28 300 L18 118 Z"
        fill="none" stroke="url(#lime)" stroke-width="25" stroke-linejoin="round"/>
</svg>
