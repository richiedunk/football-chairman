<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 576" width="640" height="576" role="img" aria-label="Undisclosed Football — the range">
  <!--
    Draft 2 — The range.

    A scout's range as the crest: two lit bounds, and between them a ball
    you cannot quite see. The numbers are the game's own scale (1-200), set
    in the mono face every figure in the game is set in. Reads as a slider
    at 48px, which is fine — it is one.
  -->
  <defs>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8E02C"/>
      <stop offset="0.5" stop-color="#C8FF4D"/>
      <stop offset="1" stop-color="#9BD124"/>
    </linearGradient>

    <clipPath id="inside"><path d="M320 12 L622 118 L612 300 C592 396 468 480 320 556 C172 480 48 396 28 300 L18 118 Z"/></clipPath>
  </defs>
  <g clip-path="url(#inside)">
    <rect x="0" y="0" width="640" height="576" fill="#08090B"/>
    <!-- The track, and the two bounds a scout has narrowed it to. -->
    <line x1="120" y1="300" x2="520" y2="300" stroke="#23262B" stroke-width="10" stroke-linecap="round"/>
    <line x1="186" y1="300" x2="454" y2="300" stroke="#C8FF4D" stroke-width="10" stroke-linecap="round"/>
    <line x1="186" y1="262" x2="186" y2="338" stroke="#C8FF4D" stroke-width="14" stroke-linecap="round"/>
    <line x1="454" y1="262" x2="454" y2="338" stroke="#C8FF4D" stroke-width="14" stroke-linecap="round"/>
    <text x="186" y="228" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-weight="700" font-size="72" fill="#FFFFFF">115</text>
    <text x="454" y="228" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-weight="700" font-size="72" fill="#FFFFFF">140</text>
    <!-- Somewhere in there is a footballer. Dark, because you cannot see him. -->
        <circle cx="320" cy="412" r="62" fill="#101215"/><circle cx="320" cy="412" r="68" fill="none" stroke="#23262B" stroke-width="6"/>
    <g transform="translate(320 412) scale(0.5167) translate(-320 -496)">
    <g stroke="#23262B" stroke-width="16.8" stroke-linecap="round">
      <line x1="320.0" y1="407.2" x2="320.0" y2="363.2"/>
      <line x1="365.7" y1="440.4" x2="445.3" y2="382.6"/>
      <line x1="348.2" y1="494.2" x2="441.9" y2="524.6"/>
      <line x1="291.8" y1="494.2" x2="198.1" y2="524.6"/>
      <line x1="274.3" y1="440.4" x2="194.7" y2="382.6"/>
    </g>
    <path d="M320.0,407.2L365.7,440.4L348.2,494.2L291.8,494.2L274.3,440.4Z" fill="#23262B"/>
    </g>
  </g>
  <path d="M320 12 L622 118 L612 300 C592 396 468 480 320 556 C172 480 48 396 28 300 L18 118 Z" fill="none" stroke="url(#lime)" stroke-width="25" stroke-linejoin="round"/>
</svg>
