<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 576" width="640" height="576" role="img" aria-label="Undisclosed Football — the stamp">
  <!--
    Draft 4 — The stamp.

    The shield as a press cutting, with the word stamped across it the way
    the fee line reads in every paper. The most literal of the four and the
    one that needs the word to work, which is a weakness at icon size and a
    strength on a hero, where the word is the joke.
  -->
  <defs>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8E02C"/>
      <stop offset="0.5" stop-color="#C8FF4D"/>
      <stop offset="1" stop-color="#9BD124"/>
    </linearGradient>

    <clipPath id="inside"><path d="M320 12 L622 118 L612 300 C592 396 468 480 320 556 C172 480 48 396 28 300 L18 118 Z"/></clipPath>
  </defs>
  <g clip-path="url(#inside)">
    <rect x="0" y="0" width="640" height="576" fill="#101215"/>
    <!-- A column of copy nobody can read, because the point is the stamp. -->
    <rect x="96" y="70" width="300" height="26" rx="5" fill="#F2F4F6"/>
    <rect x="96" y="130" width="448" height="9" rx="4" fill="#23262B"/>
    <rect x="96" y="160" width="400" height="9" rx="4" fill="#23262B"/>
    <rect x="96" y="190" width="448" height="9" rx="4" fill="#23262B"/>
    <rect x="96" y="220" width="420" height="9" rx="4" fill="#23262B"/>
    <rect x="96" y="250" width="448" height="9" rx="4" fill="#23262B"/>
    <rect x="96" y="280" width="380" height="9" rx="4" fill="#23262B"/>
    <rect x="96" y="330" width="448" height="9" rx="4" fill="#23262B"/>
    <rect x="96" y="360" width="430" height="9" rx="4" fill="#23262B"/>
    <rect x="96" y="390" width="448" height="9" rx="4" fill="#23262B"/>
    <rect x="96" y="420" width="300" height="9" rx="4" fill="#23262B"/>
    <!-- The stamp, across the story, at the angle a stamp lands at. -->
    <g transform="rotate(-14 320 288)">
      <rect x="118" y="244" width="404" height="88" rx="10" fill="#08090B" fill-opacity="0.9" stroke="#C8FF4D" stroke-width="10"/>
      <text x="320" y="307" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="800" font-size="54" letter-spacing="2" fill="#C8FF4D">UNDISCLOSED</text>
    </g>
  </g>
  <path d="M320 12 L622 118 L612 300 C592 396 468 480 320 556 C172 480 48 396 28 300 L18 118 Z" fill="none" stroke="url(#lime)" stroke-width="25" stroke-linejoin="round"/>
</svg>
