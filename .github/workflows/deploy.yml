name: Deploy

# Ship main to bunny.net edge storage, but only what CI has passed.
#
# This used to trigger on push, in parallel with CI and independent of it, so a
# commit that failed typecheck, tests or the end-to-end run shipped anyway —
# which it did, for the four runs CI was red. `workflow_run` makes the deploy
# wait for the CI run on the same commit and the `if` below drops it when that
# run did not succeed.
#
# `workflow_run` fires for CI runs on any branch, so `branches: [main]` keeps
# this to main. It only triggers from workflow files on the default branch,
# which means a change to this gate takes effect once it is merged rather than
# from the branch proposing it.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Never two deploys at once. Uploads are not transactional, and a half-written
# index.html pointing at chunks that have not landed yet is a broken site.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    environment: production
    # A CI run that failed, was cancelled, or timed out must not ship. A manual
    # dispatch has no `workflow_run` to read and is allowed through on purpose:
    # it is somebody deciding to deploy, which is the escape hatch for a CI
    # outage.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success'
    steps:
      # The exact commit CI passed, not whatever main has moved on to.
      # `workflow_run` checks out the default branch's tip by default, so two
      # pushes in quick succession would deploy the second one on the strength
      # of the first one's green run — shipping a commit nothing has tested.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Rebuilt here rather than downloaded from the CI run: a deploy that
      # builds the commit it is deploying cannot ship a stale artefact.
      # `npm run build` typechecks first and fails the deploy if it does not.
      - name: Build
        run: npm run build

      - name: Deploy to BunnyCDN
        uses: ayeressian/bunnycdn-storage-deploy@v2.4.5
        with:
          source: "dist"
          storageZoneName: "${{ secrets.BUNNY_STORAGE_ZONE }}"
          storagePassword: "${{ secrets.BUNNY_STORAGE_PASSWORD }}"
          accessKey: "${{ secrets.BUNNY_API_KEY }}"
          pullZoneId: "${{ secrets.BUNNY_PULL_ZONE_ID }}"
          upload: "true"
          remove: "false"
          purgePullZone: "true"
          purgePullZoneDelay: "15"
          maxRetries: "5"
