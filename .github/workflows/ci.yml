name: CI

# Everything that has to be true before a change is allowed near main.
#
# Until now all of it was run by hand, which worked only because the same
# person ran it every time. The suite is quick enough that there is no reason
# to split it: the unit tests are the long pole at two to four minutes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Two passes: the app under strict settings, then the whole repo
      # including tests and scripts. A diagnostic that does not compile is a
      # diagnostic nobody will run.
      - name: Typecheck
        run: npm run typecheck

      # Dead code is the most expensive class of bug in this project — a
      # feature that is written, documented and called by nothing.
      - name: Knip
        run: npx knip

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx vite build

      # The browser catches what the code cannot say. A reactivity bug that
      # typechecks, renders and screenshots correctly still fails here.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Waited for with curl rather than a wait-on dependency: the repo keeps a
      # short dependency list on purpose and knip enforces it.
      #
      # `--host 127.0.0.1` is what fixed this step. Without it vite binds to
      # whatever `localhost` resolves to, and on this runner that is not the
      # IPv4 address the curl below and `scripts/e2e.mjs` both ask for: four
      # runs spent sixty seconds each failing to reach a server that the
      # cleanup log shows was alive the entire time. Sixty attempts a second
      # apart rules out a slow start, which was the other candidate.
      #
      # Naming the address rather than a hostname takes name resolution out of
      # it altogether, which is the fix whichever way that resolution was
      # going. The banner prints the literal address now, so a future run says
      # where it actually bound.
      #
      # The preview's own output is kept, because "preview never came up" on
      # its own says nothing about why, and that is all this step said for
      # four red runs.
      - name: End-to-end
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:4173/ && break
            sleep 1
          done
          if ! curl -sf -o /dev/null http://127.0.0.1:4173/; then
            echo "preview never came up; its output was:"
            cat /tmp/preview.log
            exit 1
          fi
          node scripts/e2e.mjs

      - name: Keep the screenshots when it breaks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: /tmp/dof-e2e-shots
          if-no-files-found: ignore
          retention-days: 7
